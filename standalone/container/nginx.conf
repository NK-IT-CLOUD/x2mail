# Runs as the container user on a read-only root filesystem: pid and temp files live in /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_max_body_size 55m;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Resolved at runtime by the entrypoint (nameserver + $x2w_php upstream variable).
    include /tmp/nginx-runtime.conf;

    # Only static engine assets are served from disk; every other request goes to the front controller.
    server {
        listen 8080;

        location = /healthz {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /srv/x2mail/standalone/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass $x2w_php;
        }

        location ^~ /x2mail/v/current/static/ {
            alias /srv/x2mail/app/x2mail/v/current/static/;
            location ~ \.php$ { return 404; }
            expires 7d;
        }

        location ^~ /x2mail/v/current/themes/ {
            alias /srv/x2mail/app/x2mail/v/current/themes/;
            location ~ \.php$ { return 404; }
            expires 7d;
        }

        location / {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /srv/x2mail/standalone/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTPS on;
            fastcgi_pass $x2w_php;
        }
    }
}
