; Replaces the image's php-fpm.d defaults. Runs as the container user (no user/group directives).
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[x2mail]
listen = 9000
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[session.save_path] = /var/lib/x2mail-webmail/sessions
php_admin_value[session.gc_maxlifetime] = 36000
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 55M
php_admin_value[memory_limit] = 256M
php_admin_value[upload_tmp_dir] = /tmp
